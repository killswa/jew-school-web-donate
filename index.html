<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>โรงเรียนของเรา - ยอดบริจาครวม</title>
    <link rel="stylesheet" href="style.css">
    <!-- Google Fonts: Mali (ฟอนต์น่ารัก สไตล์ลายมือ/โรงเรียน) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Mali:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>

    <div class="container">
        <!-- Header / ป้ายชื่อโรงเรียน -->
        <header class="school-header">
            <div class="badge">🏫 School Donation Fund</div>
            <h1>โครงการระดมทุนเพื่อการศึกษา</h1>
            <p>ร่วมเป็นผู้ให้ เพื่ออนาคตที่สดใสของน้องๆ นักเรียน</p>
        </header>

        <!-- Summary Blackboard / กระดานดำสรุปยอดรวม -->
        <section class="blackboard-summary">
            <div class="blackboard-inner">
                <h2>✏️ ยอดบริจาครวมทั้งหมด</h2>
                <div class="total-amount-box">
                    <span id="total-donated">0</span> <small>บาท</small>
                </div>
                <div class="stats-grid">
                    <div class="stat-item">
                        <span>เป้าหมายรวม:</span>
                        <strong id="total-target">0</strong> บาท
                    </div>
                    <div class="stat-item">
                        <span>จำนวนโปรเจกต์:</span>
                        <strong id="project-count">0</strong> โครงการ
                    </div>
                </div>
            </div>
        </section>

        <!-- Sub Projects Section / โปรเจกต์ย่อย -->
        <main class="projects-section">
            <h2 class="section-title">🎒 โครงการย่อยทั้งหมด</h2>
            <div id="projects-grid" class="projects-grid">
                <div class="loading">กำลังโหลดข้อมูลโครงการน่ารักๆ... 🐻</div>
            </div>
        </main>

        <footer>
            <p>🏫 ขอขอบคุณทุกๆ การสนับสนุนจากผู้ใจดีทุกท่าน 🤎</p>
        </footer>
    </div>

    <!-- PapaParse Library สำหรับอ่าน CSV จาก Google Sheets -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
